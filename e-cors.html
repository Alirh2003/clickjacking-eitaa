<!DOCTYPE html>
<html>
<head>
    <title>Eitaa CORS Tester</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        input, textarea { width: 100%; margin-bottom: 10px; }
        button { padding: 10px; cursor: pointer; }
        pre { background: #111; color: #0f0; padding: 10px; overflow:auto; }
    </style>
</head>
<body>

<h2>Raw CORS Request Tester (Eitaa)</h2>

<label>Ticket ID:</label>
<input id="ticket" value="490188">

<label>Session Cookie:</label>
<textarea id="cookie">myeitaa_session=PUT_YOUR_COOKIE_HERE</textarea>

<button onclick="sendReq()">Send Request</button>

<pre id="out"></pre>

<script>
async function sendReq() {

    const ticketId = document.getElementById("ticket").value.trim();
    const cookie = document.getElementById("cookie").value.trim();

    const url = `https://my.eitaa.com/api/v1/ticket/show/${ticketId}`;

    try {

        const res = await fetch(url, {
            method: "POST",
            headers: {
                "Accept": "application/json, text/plain, */*",
                "Content-Type": "application/json",
                "Origin": "https://my.eitaa.com",
                "Cookie": cookie
            },
            credentials: "include"
        });

        const text = await res.text();

        let output =
            "STATUS: " + res.status + "\n\n" +
            "RESPONSE HEADERS:\n";

        res.headers.forEach((v, k) => {
            output += k + ": " + v + "\n";
        });

        output += "\nRESPONSE BODY:\n" + text;

        document.getElementById("out").innerText = output;

    } catch (e) {
        document.getElementById("out").innerText =
            "ERROR:\n" + e;
    }
}
</script>

</body>
</html>
