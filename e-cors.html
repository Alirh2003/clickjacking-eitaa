<!DOCTYPE html>
<html>
<head>
    <title>Eitaa VerifyCode CORS Tester</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        input, textarea { width: 100%; margin-bottom: 10px; }
        button { padding: 10px; }
        pre { background: #111; color: #0f0; padding: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>

<h2>Eitaa /verifyCode CORS Test</h2>

<p>Reply Code:</p>
<input id="reply_code" placeholder="reply_code">

<p>Code:</p>
<input id="code" placeholder="code">

<p>Optional Origin (for testing spoof behavior):</p>
<input id="origin" value="https://alirh2003.github.io">

<button onclick="send()">Send Request</button>

<pre id="out"></pre>

<script>

async function send() {

    const reply_code = document.getElementById("reply_code").value;
    const code = document.getElementById("code").value;
    const origin = document.getElementById("origin").value;

    const url = "https://my.eitaa.com/api/v1/verifyCode";

    const payload = {
        reply_code: reply_code,
        code: code
    };

    try {

        const res = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json",
                "Origin": origin
            },

            credentials: "include",
            body: JSON.stringify(payload)
        });

        const text = await res.text();

        let headers = "";
        res.headers.forEach((v, k) => {
            headers += k + ": " + v + "\n";
        });

        document.getElementById("out").innerText =
            "STATUS: " + res.status + "\n\n" +
            "=== RESPONSE HEADERS ===\n" +
            headers +
            "\n=== RESPONSE BODY ===\n" +
            text;

    } catch (e) {

        document.getElementById("out").innerText =
            "ERROR (likely CORS blocked):\n" + e;
    }
}

</script>

</body>
</html>
