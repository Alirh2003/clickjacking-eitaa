<!DOCTYPE html>
<html>
<head>
    <title>Eitaa File Show Request</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        input { width: 100%; margin-bottom: 10px; }
        button { padding: 10px; cursor: pointer; }
        pre { background: #111; color: #0f0; padding: 10px; overflow:auto; }
    </style>
</head>
<body>

<h2>Eitaa File Show Request Tester</h2>

<label>File ID:</label>
<input id="file" value="151300_69fae370d5bcf_1048">

<label>Ticket:</label>
<input id="ticket" value="490188">

<label>Message:</label>
<input id="message" value="1098604">

<button onclick="send()">Send Request</button>

<pre id="out"></pre>

<script>
async function send() {

    const file = document.getElementById("file").value;
    const ticket = document.getElementById("ticket").value;
    const message = document.getElementById("message").value;

    const url = `https://my.eitaa.com/api/v1/file/show/${file}?ticket=${ticket}&message=${message}`;

    try {

        const res = await fetch(url, {
            method: "GET",
            credentials: "include",
            headers: {
                "Cookie": "myeitaa_session=eyJpdiI6IkdVdDFNUXZBcXI1b1RkeVJFRGFzYXc9PSIsInZhbHVlIjoieWg5UEg0YlYrOW9tMGpSQm9GbzF2eDhnbHlsYzVLTWlDV0tDd2xuY3hEcmR4enN6ZTRyV044dUtUSWxuUUpwQXMrcGhsVk5ucXBwSjlWT0hVZ0J4Q1l1RC9JQlRVemJycGNBaStJRTlNSkp6NVFpMi9RZGUrLzFUNEVNcUE0N2UiLCJtYWMiOiJmNTE3MzM1YzY5N2Y4OTVhZmRlNDhiNWM4NDExMDllNzM4ZTc5MDBjMDZmODI1ODBjNjZiNzJlZWNhYmM0MzZiIiwidGFnIjoiIn0%3D",
                "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
            }
        });

        let output = "";

        output += "STATUS: " + res.status + "\n\n";

        output += "=== RESPONSE HEADERS ===\n";
        res.headers.forEach((v, k) => {
            output += k + ": " + v + "\n";
        });

        output += "\n=== RESPONSE BODY ===\n";

        const contentType = res.headers.get("content-type");

        if (contentType && contentType.includes("pdf")) {

            const blob = await res.blob();
            output += "PDF FILE RECEIVED\n";
            output += "Size: " + blob.size + " bytes\n";

        } else {

            const text = await res.text();
            output += text;

        }

        document.getElementById("out").innerText = output;

    } catch (e) {
        document.getElementById("out").innerText = "ERROR:\n" + e;
    }
}
</script>

</body>
</html>
