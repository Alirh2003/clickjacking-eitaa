<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CORS Test Page</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    textarea { width: 100%; height: 200px; margin-top: 10px; }
    button { padding: 10px 20px; cursor: pointer; }
  </style>
</head>
<body>

<h2>CORS Test Tool</h2>

<label>Target URL:</label>
<input id="url" style="width:100%" value="https://my.eitaa.com/api/v1/loginByEitaa"/>

<br><br>

<label>Request Body (JSON):</label>
<textarea id="body">{ "phone": "09373371480" }</textarea>

<br><br>

<button onclick="sendRequest()">Send Request</button>

<h3>Response:</h3>
<pre id="output"></pre>

<script>
async function sendRequest() {
    const url = document.getElementById("url").value;
    const body = document.getElementById("body").value;
    const output = document.getElementById("output");

    output.textContent = "Sending request...\n";

    try {
        const res = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include", // مهم برای تست CORS واقعی
            body: body
        });

        const text = await res.text();

        output.textContent =
            "Status: " + res.status + "\n\n" +
            "Response:\n" + text;

    } catch (err) {
        output.textContent =
            "CORS Error or Network Error:\n\n" + err;
    }
}
</script>

</body>
</html>
