<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CORS Ticket Tester</title>
<style>
body { font-family: monospace; background:#111; color:#0f0; padding:20px; }
input, button { padding:10px; margin:5px; }
pre { background:#000; padding:10px; border:1px solid #0f0; }
</style>
</head>
<body>

<h2>CORS Ticket Fetch Tester</h2>

<input id="tid" placeholder="Ticket ID (e.g. 490188)" />
<button onclick="run()">Send Request</button>

<pre id="out">Result will appear here...</pre>

<script>
async function run() {
    const id = document.getElementById("tid").value;

    if (!id) {
        document.getElementById("out").innerText = "Enter Ticket ID";
        return;
    }

    try {
        const url = `https://my.eitaa.com/api/v1/ticket/show/${id}`;

        const res = await fetch(url, {
            method: "POST",
            credentials: "include",
            headers: {
                "Accept": "application/json, text/plain, */*"
            }
        });

        const text = await res.text();

        document.getElementById("out").innerText =
            "STATUS: " + res.status + "\n\n" + text;

    } catch (e) {
        document.getElementById("out").innerText = "ERROR:\n" + e;
    }
}
</script>

</body>
</html>
