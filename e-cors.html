<!DOCTYPE html>
<html>
<body>

<h2>Eitaa File Debug Tester</h2>

<button onclick="run()">Send Request</button>

<pre id="out"></pre>

<script>

async function run() {

    const url = "https://my.eitaa.com/api/v1/file/show/151300_69fae370d5bcf_1048?ticket=490188&message=1098604";

    try {

        const res = await fetch(url, {
            method: "GET",
            credentials: "include"
        });

        let out = "";

        out += "STATUS: " + res.status + "\n\n";

        out += "URL: " + url + "\n\n";

        out += "HEADERS SENT BY BROWSER:\n";
        out += "- Cookie: (automatic if available)\n";
        out += "- Origin: " + location.origin + "\n\n";

        out += "RESPONSE HEADERS:\n";

        res.headers.forEach((v, k) => {
            out += k + ": " + v + "\n";
        });

        out += "\nRESPONSE BODY:\n";
        out += await res.text();

        document.getElementById("out").innerText = out;

    } catch (e) {
        document.getElementById("out").innerText = e;
    }
}

</script>

</body>
</html>
